{% extends "portfolio/base.html" %}

{% block content %}
<h2>Formações</h2>

<section>
    {% for formacao in formacoes %}
        <article>
            <h3>{{formacao.tipo}}</h3>
            <h4>{{formacao.data}}</h4>
            <br>
            <p>{{formacao.descricao}}</p>
        </article>
    {% endfor %}
</section>


{% endblock %}
